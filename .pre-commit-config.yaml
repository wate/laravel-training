---
# yamllint disable rule:quoted-strings
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  # nodeenvがNode 24のプレビュー版を解決できず失敗するため、システムのNode.jsを使う
  node: system
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        exclude: ^\.(vscode|devcontainer)/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: check-added-large-files
        args:
          - "--maxkb=1000"
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, master, --branch, main, --branch, staging]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint-fix
      - id: markdownlint
  - repo: local
    hooks:
      - id: php-lint
        name: php-lint
        entry: php -l
        language: system
        types: [php]
        exclude: ^(vendor|node_modules|storage|bootstrap/cache)/|\.blade\.php$
      - id: pint
        name: pint
        entry: ./vendor/bin/pint
        language: system
        types: [php]
        exclude: ^(vendor|node_modules|storage|bootstrap/cache)/|\.blade\.php$
      - id: phpstan
        name: phpstan
        entry: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
        language: system
        types: [php]
        pass_filenames: false
        exclude: ^(vendor|node_modules|storage|bootstrap/cache)/|\.blade\.php$
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: \.(js|css)$
        exclude: ^(node_modules|vendor|public)/
